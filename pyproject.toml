[project]
name = "agent-world-model"
version = "0.2.0"
description = "Loop-engineered foundry for executable agent environments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "defusedxml==0.7.1",
    "httpx>=0.28.1,<1",
    "jsonschema>=4.26,<5",
    "lxml==6.1.1",
    "openai-codex>=0.144.4,<0.145",
    "packaging>=24,<27",
    "pyarrow>=20,<23",
    "pydantic==2.12.5",
    "trafilatura>=2.0,<3",
]

[dependency-groups]
dev = [
    "mypy==1.19.1",
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.21",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_world"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "live: invokes real external LLM/search services and never counts as an offline pass",
]

[project.scripts]
agent-world = "agent_world.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".agent-world-live",
    ".agents",
    ".claude",
    ".codex",
    ".trellis",
    "research/data",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]
