[project]
name = "agent-world-model"
version = "0.3.0"
description = "Clean-break Direct environment foundry"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["openai==2.54.0", "openai-codex==0.144.4"]

[dependency-groups]
dev = [
    "mypy==1.19.1",
    "pytest==8.4.2",
    "ruff==0.15.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_world"]

[project.scripts]
agent-world = "agent_world.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "live: invokes real external LLM/search services and never counts as an offline pass",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".agent-world-runs", ".agents", ".claude", ".codex", ".trellis"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]
