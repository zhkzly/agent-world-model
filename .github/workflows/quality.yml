name: deterministic-quality

on:
  push:
    branches: [s2-task-foundry]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deterministic-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Sync exact project
        run: uv sync --frozen --all-groups
      - name: Apply deterministic safe formatting
        run: |
          uv run ruff check --fix src tests
          uv run ruff format src tests
      - name: Commit formatter-only changes
        shell: bash
        run: |
          if ! git diff --quiet -- src tests; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "style: apply deterministic Ruff fixes [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Ruff format
        run: uv run ruff format --check src tests
      - name: Mypy
        run: uv run mypy src
      - name: Pytest
        run: uv run pytest -q
      - name: Record validated head
        run: git rev-parse HEAD
