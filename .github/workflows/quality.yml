name: deterministic-quality

on:
  push:
    branches: [s2-task-foundry]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deterministic-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Validate deterministic S2 gates
        run: bash scripts/validate_s2_deterministic.sh
      - name: Record validated head
        run: git rev-parse HEAD
