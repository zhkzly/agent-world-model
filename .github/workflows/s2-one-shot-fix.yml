name: S2 one-shot fix and validation

on:
  push:
    branches: [s2-task-foundry]
    paths:
      - .github/workflows/s2-one-shot-fix.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: s2-task-foundry
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync exact project dependencies
        run: uv sync --frozen --all-groups
      - name: Apply scoped Ruff fixes
        run: |
          uv run ruff check --fix \
            src/agent_task_foundry \
            src/agent_env_foundry/semantics.py \
            tests/task_foundry
          uv run ruff format \
            src/agent_task_foundry \
            src/agent_env_foundry/semantics.py \
            tests/task_foundry
      - name: Commit mechanical fixes
        run: |
          if git diff --quiet; then
            echo "No Ruff changes required"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/agent_task_foundry src/agent_env_foundry/semantics.py tests/task_foundry
            git commit -m "style: apply scoped S2 Ruff fixes"
            git push origin HEAD:s2-task-foundry
          fi
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Ruff format
        run: uv run ruff format --check src tests
      - name: Mypy
        run: uv run mypy src
      - name: Pytest
        run: uv run pytest -q
