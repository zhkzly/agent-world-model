name: Apply reviewed S2 type-contract repairs

on:
  push:
    branches: [s2-task-foundry]
    paths:
      - .github/workflows/s2-type-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: s2-task-foundry
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Apply guarded source repairs
        run: python scripts/apply_s2_type_repairs.py
      - name: Format repaired files
        run: |
          uv sync --frozen --all-groups
          uv run ruff check --fix src/agent_task_foundry tests/task_foundry
          uv run ruff format src/agent_task_foundry tests/task_foundry
      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agent_task_foundry tests/task_foundry
          git commit -m "fix: close S2 comparison and Responses type contracts"
          git push origin HEAD:s2-task-foundry
      - name: Run the exact deterministic validation command
        run: bash scripts/validate_s2_deterministic.sh
